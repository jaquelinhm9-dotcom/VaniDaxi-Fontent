    <rect x="190" y="580" width="120" height="50" rx="10"/><rect x="435" y="580" width="120" height="50" rx="10"/>
    <rect x="1010" y="580" width="120" height="50" rx="10"/><rect x="1260" y="580" width="120" height="50" rx="10"/>
  </g>
</g>
<!-- Personas estilizadas, con anatomía deliberadamente simple y consistente -->
