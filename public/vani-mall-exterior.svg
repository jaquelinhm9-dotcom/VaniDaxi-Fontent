<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Frente exterior del mall VaniDaxi</title>
<desc id="desc">Centro comercial moderno con letrero VaniDaxi, entrada principal, locales de moda, tecnología, hogar, servicios y supermercado, y personas entrando y saliendo.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe7ea"/><stop offset="1" stop-color="#edf6f5"/></linearGradient>
  <linearGradient id="facade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26383a"/><stop offset=".5" stop-color="#516466"/><stop offset="1" stop-color="#1e2b2d"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dff7f7" stop-opacity=".92"/><stop offset="1" stop-color="#6e9ea0" stop-opacity=".86"/></linearGradient>
  <linearGradient id="walk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aebfc0"/><stop offset="1" stop-color="#677779"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="20" stdDeviation="18" flood-opacity=".28"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
  <linearGradient id="sign" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b6d70"/><stop offset=".5" stop-color="#20c3b9"/><stop offset="1" stop-color="#0b6d70"/></linearGradient>
</defs>
<rect width="1600" height="1000" fill="url(#sky)"/>
<circle cx="1260" cy="140" r="170" fill="#fff" opacity=".25" filter="url(#soft)"/>
<rect y="690" width="1600" height="310" fill="url(#walk)"/>
<g filter="url(#shadow)">
  <rect x="90" y="225" width="1420" height="520" rx="38" fill="url(#facade)"/>
  <rect x="130" y="270" width="1340" height="225" rx="28" fill="#152426" opacity=".56"/>
  <g fill="url(#glass)" stroke="#efffff" stroke-opacity=".26" stroke-width="5">
    <rect x="150" y="320" width="225" height="150" rx="15"/><rect x="395" y="320" width="225" height="150" rx="15"/>
    <rect x="1060" y="320" width="225" height="150" rx="15"/><rect x="1305" y="320" width="125" height="150" rx="15"/>
  </g>
  <g opacity=".2" stroke="#fff" stroke-width="5">
    <path d="M210 330v130M270 330v130M335 330v130"/><path d="M455 330v130M520 330v130M585 330v130"/>
    <path d="M1115 330v130M1180 330v130M1245 330v130"/><path d="M1360 330v130"/>
  </g>
  <rect x="620" y="300" width="370" height="420" rx="32" fill="#0e1a1c"/>
  <rect x="665" y="350" width="280" height="305" rx="28" fill="url(#glass)" stroke="#efffff" stroke-opacity=".28" stroke-width="5"/>
  <path d="M720 655V430h170v225" fill="#143133" opacity=".34"/>
  <path d="M680 420h250" stroke="#fff" stroke-opacity=".36" stroke-width="5"/>
  <rect x="135" y="255" width="1330" height="66" rx="20" fill="#0d282a"/>
  <rect x="480" y="267" width="640" height="78" rx="28" fill="url(#sign)" stroke="#b8fffa" stroke-opacity=".28" stroke-width="3"/>
  <text x="800" y="320" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="800" letter-spacing="8">VANIDAXI</text>
  <text x="800" y="392" text-anchor="middle" fill="#fff" fill-opacity=".8" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="4">TODO EN UN SOLO LUGAR</text>
  <g font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800">
    <rect x="155" y="515" width="225" height="155" rx="18" fill="#f5d7de"/><text x="267" y="550" text-anchor="middle" fill="#703943">MODA</text>
    <rect x="400" y="515" width="225" height="155" rx="18" fill="#d8ecfb"/><text x="512" y="550" text-anchor="middle" fill="#355f83">TECNOLOGÍA</text>
    <rect x="975" y="515" width="225" height="155" rx="18" fill="#f2e7c7"/><text x="1087" y="550" text-anchor="middle" fill="#79662f">HOGAR</text>
    <rect x="1220" y="515" width="210" height="155" rx="18" fill="#dfd6f4"/><text x="1325" y="550" text-anchor="middle" fill="#59447d">SERVICIOS</text>
  </g>
  <rect x="700" y="515" width="210" height="155" rx="18" fill="#d9efd9"/>
  <text x="805" y="550" text-anchor="middle" fill="#3b6d42" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800">SUPERMERCADO</text>
