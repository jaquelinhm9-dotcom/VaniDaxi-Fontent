name: Fix payment flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-payment-flow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force Stripe-only payment UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('App.jsx')
          s = p.read_text()
          s = s.replace("const[pay,setPay]=useState(()=>read('vanidaxi-payment',{method:'Tarjeta',detail:''}))", "const[pay,setPay]=useState(()=>({method:'Stripe',detail:''}))")
          s = s.replace("if(x.payment)setPay(x.payment)", "if(x.payment)setPay({method:'Stripe',detail:''})")
          s = s.replace("if(x.payment)setPay({method:'Stripe',detail:''})", "if(x.payment)setPay({method:'Stripe',detail:''})")
          s = s.replace("createCommercialOrder({items:cart,address,payment},products)", "createCommercialOrder({items:cart,address,payment:{method:'stripe'}},products)")
          s = s.replace("['Tarjeta','Contra entrega']", "['Tarjeta']")
          s = s.replace("pay.method==='Contra entrega'||/^\\d{4}$/.test(pay.detail||'')", "true")
          s = re.sub(r"\{pay\.method==='Tarjeta'&&<input value=\{pay\.detail\} onChange=\{e=>setPay\(\{\.\.\.pay,method:m\}\)\}[^}]*\/>\}", "", s)
          s = re.sub(r"\{pay\.method==='Tarjeta'&&<input value=\{pay\.detail\} onChange=\{e=>setPay\(\{\.\.\.pay,detail:e\.target\.value\.replace\(/\\\\D/g,''\)\.slice\(0,4\)\}\)\} placeholder=\"Últimos 4 dígitos\" inputMode=\"numeric\" maxLength=\{4\}/>\}", "", s)
          s = re.sub(r"\{pay\.method==='Tarjeta'&&<label>Últimos 4 dígitos<input[^>]*/></label>\}", "", s)
          s = s.replace("<b>{pay.method}</b><small>{pay.detail?`•••• ${pay.detail}`:'Sin método guardado'}</small>", "<b>Stripe · Tarjeta</b><small>El pago se completa de forma segura en Stripe Checkout.</small>")
          s = s.replace("<button disabled={!ok} onClick={()=>order({address:addr,payment:pay})}>Confirmar pedido <Check size={15}/>", "<button disabled={!ok} onClick={()=>order({address:addr,payment:{method:'stripe'}})}>Continuar a pago seguro <CreditCard size={15}/>")
          s = s.replace("{!ok&&<small>Completa la dirección y el método de pago para continuar.</small>}", "{!ok&&<small>Completa la dirección de entrega para continuar.</small>}")
          p.write_text(s)
          if 'Contra entrega' in s:
              raise SystemExit('ERROR: Contra entrega still present')
          if 'Últimos 4 dígitos' in s:
              raise SystemExit('ERROR: last-4 card field still present')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App.jsx
          git diff --cached --quiet || git commit -m 'remove legacy payment method UI'
          git push
