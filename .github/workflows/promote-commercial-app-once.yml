name: One-time promote commercial App
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote AppFixed to App and clean source
        run: |
          cp AppFixed.jsx App.jsx
          python - <<'PY'
          from pathlib import Path
          p=Path('App.jsx')
          s=p.read_text()
          s=s.replace("Bell,Heart,Home,Grid2X2", "Bell,Heart,Home as HomeIcon,Grid2X2")
          s=s.replace("function Home({", "function HomePage({")
          s=s.replace("s==='home'&&<Home go=", "s==='home'&&<HomePage go=")
          s=s.replace("const x=[[Home,'Inicio','home']", "const x=[[HomeIcon,'Inicio','home']")
          s=s.replace("export default function AppFixed()", "export default function App()")
          p.write_text(s)
          PY
          rm -f AppFixed.jsx .github/workflows/promote-commercial-app-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App.jsx AppFixed.jsx .github/workflows/promote-commercial-app-once.yml
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: promote commercial storefront as single App entrypoint'
          git push
