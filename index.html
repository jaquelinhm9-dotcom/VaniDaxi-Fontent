<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f0fa" />
    <meta name="description" content="VaniDaxi — moda, tecnología, hogar y mucho más." />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./polish.css?v=4" />
    <title>VaniDaxi</title>
    <script>
      try {
        const raw = localStorage.getItem('vanidaxi-address')
        if (!raw) localStorage.setItem('vanidaxi-address', JSON.stringify({ name: '', street: '', city: '', zip: '' }))
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.jsx?v=4"></script>
    <script src="./checkout-fixes.js?v=4"></script>
    <script>
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js?v=4', { updateViaCache: 'none' }).catch(() => {})
    </script>
  </body>
</html>
