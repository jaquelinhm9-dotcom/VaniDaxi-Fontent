<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f0fa" />
    <meta name="description" content="VaniDaxi — moda, tecnología, hogar y mucho más." />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./polish.css" />
    <title>VaniDaxi</title>
    <script>
      try {
        const raw = localStorage.getItem('vanidaxi-address')
        if (raw) {
          const data = JSON.parse(raw)
          if (data && typeof data === 'object') {
            data.name = 'Mi cuenta'
            localStorage.setItem('vanidaxi-address', JSON.stringify(data))
          }
        } else {
          localStorage.setItem('vanidaxi-address', JSON.stringify({ name: 'Mi cuenta', street: '', city: '', zip: '' }))
        }
      } catch (_) {}
    </script>
    <script src="./runtime-fixes.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
    <script src="./auth-ui.js"></script>
    <script>
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {})
    </script>
  </body>
</html>
